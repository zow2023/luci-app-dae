name: Build Web

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

# GITHUB_TOKEN 所需权限
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Build System Setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools jq dos2unix
          sudo npm install -g pnpm
          sudo npm install -g taze

      - name: Update Makefile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          chmod 755 ./dae/files/dae.init
          find ./ -type f -exec dos2unix {} \; -print

          # 获取上游提交信息
          commit_info="$(curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ppdragon16/dae/commits/next)"

          latest_commit_full="$(jq -er '.sha | select(test("^[a-f0-9]{40}$"))' <<< "$commit_info")"
          latest_commit="${latest_commit_full:0:7}"

          committer_date="$(jq -er '.commit.committer.date' <<< "$commit_info")"
          latest_core_date="$(date --date="$committer_date" '+%Y.%m.%d')"

          author_date="$(jq -er '.commit.author.date' <<< "$commit_info")"
          formatted_timestamp="$(date --date="$author_date" '+%Y-%m-%d')"

          # 更新 Makefile
          sed -i '/PKG_VERSION:/d' ./dae/Makefile
          sed -i "7 a PKG_VERSION:=$latest_core_date" ./dae/Makefile

          sed -i '/PKG_SOURCE_VERSION:/d' ./dae/Makefile
          sed -i "12 a PKG_SOURCE_VERSION:=$latest_commit_full" ./dae/Makefile

          echo "version=$formatted_timestamp-$latest_commit" >> "$GITHUB_ENV"

      - name: Commit file
        run: |
          set -e

          rm -rf build

          git config user.email "simonsqiu@foxmail.com"
          git config user.name "SimonsQiu"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "has_changes=false" >> "$GITHUB_ENV"
          else
            git commit -m "Update $(date '+%Y/%m/%d %H:%M:%S %Z')"
            echo "has_changes=true" >> "$GITHUB_ENV"
          fi

      - name: Push changes
        if: env.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" \
            push origin HEAD:refs/heads/ppdragon16

      # 清理 3 天以前的 Workflow Runs
      - name: Cleanup Workflow Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cutoff="$(date -u -d '3 days ago' +%s)"

          gh run list --limit 1000 \
            --json databaseId,createdAt |
          jq -r --argjson cutoff "$cutoff" '
            .[]
            | select((.createdAt | fromdateiso8601) < $cutoff)
            | .databaseId
          ' |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Deleting workflow run: $run_id"
            gh run delete "$run_id" --yes || true
          done
        continue-on-error: true

      # 只保留最新 3 个 Release，并删除对应旧 Tag
      - name: Delete Older Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release list --limit 100 \
            --json tagName,publishedAt |
          jq -r '.[3:][].tagName' |
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
        continue-on-error: true

      # 清理 3 天以前的 Artifacts
      - name: Cleanup Old Action Artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '3 days'
          skip-recent: 3
        continue-on-error: true
